<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — FestFlow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #08080a;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #111116;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(24, 207, 252, 0.12);
      color: #18cffc;
      border: 1px solid rgba(24, 207, 252, 0.25);
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #18cffc;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 1.25rem;
      border-radius: 0.875rem;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 48px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #18cffc, #7f1afb);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 15px rgba(24, 207, 252, 0.25);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #18181f;
      color: #d4d4d8;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-secondary:hover {
      background: #202029;
      color: #ffffff;
    }
    .footer-note {
      font-size: 0.75rem;
      color: #71717a;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>No Internet Connection</span>
    </div>
    <h1>You're Currently Offline</h1>
    <p>
      FestFlow couldn't reach the server. Previously loaded digital passes and cached event details remain safely accessible on this device.
    </p>
    <div class="btn-group">
      <button class="btn-primary" onclick="window.location.reload()">
        Try Reconnecting
      </button>
      <a href="/student/dashboard" class="btn-secondary">
        View My Digital Passes
      </a>
    </div>
    <div class="footer-note">
      FestFlow PWA • Cache-First Pass Storage Active
    </div>
  </div>
  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
